name: Supabase Types Sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'fix(types): synchronize Supabase generated types')
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: uzhqhieqlcyncelltfjw
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Supabase credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_ID"

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Generate database types from production
        run: supabase gen types typescript --linked > src/integrations/supabase/types.ts

      - name: Commit generated types
        run: |
          git config user.name "marcenapp-types-bot"
          git config user.email "marcenapp-types-bot@users.noreply.github.com"
          git add src/integrations/supabase/types.ts
          if git diff --cached --quiet; then
            echo "Generated types are already synchronized."
            exit 0
          fi
          git commit -m "fix(types): synchronize Supabase generated types"
          git push origin HEAD:main
