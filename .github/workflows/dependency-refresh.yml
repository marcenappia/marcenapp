name: Dependency Refresh
on:
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts vite@6.4.3 vitest@4.1.11 react-router-dom@6.30.6 postcss@8.5.28
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-refresh
          path: |
            package.json
            package-lock.json
