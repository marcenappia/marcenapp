name: Playwright Tests
# Full validation gate for the release branch; never deploys or merges.
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  id-token: write

concurrency:
  group: marcenapp-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm

    - name: Install dependencies
      id: install
      run: npm ci

    - name: Dependency audit (high/critical block)
      id: audit
      if: ${{ steps.install.outcome == 'success' }}
      run: |
        set +e
        npm audit --audit-level=high --json > npm-audit.json
        audit_exit=$?
        node - <<'NODE'
        const fs = require('fs');
        const audit = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
        const meta = audit.metadata?.vulnerabilities ?? {};
        console.log('AUDIT SUMMARY', JSON.stringify(meta));
        for (const [name, info] of Object.entries(audit.vulnerabilities ?? {})) {
          if (['high', 'critical'].includes(info.severity)) {
            console.log(JSON.stringify({ package: name, severity: info.severity, isDirect: info.isDirect, via: info.via?.map(v => typeof v === 'string' ? v : v.name), range: info.range, fixAvailable: info.fixAvailable }));
          }
        }
        NODE
        if [ "$audit_exit" -ne 0 ]; then
          echo "High/critical dependency vulnerabilities detected."
          exit "$audit_exit"
        fi

    - name: Lint
      id: lint
      if: ${{ steps.install.outcome == 'success' }}
      run: npm run lint

    - name: Typecheck
      id: typecheck
      if: ${{ steps.install.outcome == 'success' }}
      run: npx tsc -p tsconfig.app.json --noEmit

    - name: Unit tests
      id: unit
      if: ${{ steps.install.outcome == 'success' }}
      run: npm run test

    - name: Production build
      id: build
      if: ${{ steps.install.outcome == 'success' }}
      run: npm run build

    - name: Install Playwright Browsers
      if: ${{ steps.install.outcome == 'success' }}
      run: npx playwright install --with-deps

    - name: Bootstrap ephemeral E2E session
      id: e2e_bootstrap
      if: ${{ steps.install.outcome == 'success' }}
      env:
        SUPABASE_URL: https://uzhqhieqlcyncelltfjw.supabase.co
      run: |
        set -euo pipefail
        oidc_token="$(curl -fsSL           -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"           "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=marcenapp-e2e" |
          node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).value))")"

        curl -fsSL -X POST           "$SUPABASE_URL/functions/v1/e2e-bootstrap"           -H "Authorization: Bearer $oidc_token"           -H "Content-Type: application/json"           --data '{"action":"create"}'           > "$RUNNER_TEMP/e2e-session.json"

        node - "$RUNNER_TEMP/e2e-session.json" <<'NODE'
        const fs = require('fs');
        const file = process.argv[2];
        const response = JSON.parse(fs.readFileSync(file, 'utf8'));
        if (!response.user_id) {
          throw new Error('e2e-bootstrap did not return a user id');
        }
        fs.appendFileSync(process.env.GITHUB_ENV, `E2E_USER_ID=${response.user_id}\n`);
        const session = response.session;
        if (!session?.access_token || !session?.refresh_token || !session?.user?.email) {
          throw new Error('e2e-bootstrap returned an invalid session payload');
        }
        const encoded = Buffer.from(JSON.stringify(session), 'utf8').toString('base64');
        fs.appendFileSync(process.env.GITHUB_ENV, `E2E_SESSION_B64=${encoded}\n`);
        console.log('Ephemeral E2E session bootstrapped.');
        NODE

        session_b64="$(grep '^E2E_SESSION_B64=' "$GITHUB_ENV" | tail -1 | cut -d= -f2-)"
        echo "::add-mask::$session_b64"

    - name: Billing Sandbox smoke test
      id: billing_smoke
      if: ${{ steps.e2e_bootstrap.outcome == 'success' }}
      env:
        SUPABASE_URL: https://uzhqhieqlcyncelltfjw.supabase.co
        E2E_SESSION_B64: ${{ env.E2E_SESSION_B64 }}
      run: |
        set -euo pipefail
        access_token="$(printf '%s' "$E2E_SESSION_B64" | base64 -d | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).access_token))")"

        status="$(curl -fsSL -X POST           "$SUPABASE_URL/functions/v1/asaas"           -H "Authorization: Bearer $access_token"           -H "Content-Type: application/json"           --data '{"action":"connection_status"}')"
        node - "$status" <<'NODE'
        const body = JSON.parse(process.argv[2]);
        if (!body.connected || body.environment !== 'sandbox') {
          throw new Error(`Asaas Sandbox is not ready: ${JSON.stringify(body)}`);
        }
        NODE

        customer="$(curl -fsSL -X POST           "$SUPABASE_URL/functions/v1/asaas"           -H "Authorization: Bearer $access_token"           -H "Content-Type: application/json"           --data '{"action":"create_customer"}')"
        customer_id="$(node - "$customer" <<'NODE'
        const body = JSON.parse(process.argv[2]);
        const id = body.customer?.id;
        if (!id) throw new Error(`Asaas customer creation failed: ${JSON.stringify(body)}`);
        process.stdout.write(String(id));
        NODE
        )"

        payment="$(node -e 'console.log(JSON.stringify({action:"create_product_payment",productKey:"render_unit",customerId:process.argv[1],billingType:"UNDEFINED",idempotencyKey:"ci-"+process.env.GITHUB_RUN_ID+"-"+process.env.GITHUB_RUN_ATTEMPT}))' "$customer_id")"
        payment_response="$(curl -fsSL -X POST           "$SUPABASE_URL/functions/v1/asaas"           -H "Authorization: Bearer $access_token"           -H "Content-Type: application/json"           --data "$payment")"
        node - "$payment_response" <<'NODE'
        const body = JSON.parse(process.argv[2]);
        if (!body.payment?.id || !body.checkoutUrl) {
          throw new Error(`Asaas Sandbox payment creation failed: ${JSON.stringify(body)}`);
        }
        console.log(`Billing Sandbox PASS: payment ${body.payment.id} created and persisted.`);
        NODE

    - name: Run Playwright tests
      id: playwright
      if: ${{ steps.install.outcome == 'success' && steps.e2e_bootstrap.outcome == 'success' }}
      run: npx playwright test

    - name: Cleanup ephemeral E2E user
      if: ${{ always() && steps.e2e_bootstrap.outcome == 'success' }}
      env:
        SUPABASE_URL: https://uzhqhieqlcyncelltfjw.supabase.co
        E2E_USER_ID: ${{ env.E2E_USER_ID }}
      run: |
        set -euo pipefail
        oidc_token="$(curl -fsSL           -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"           "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=marcenapp-e2e" |
          node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).value))")"
        curl -fsSL -X POST           "$SUPABASE_URL/functions/v1/e2e-bootstrap"           -H "Authorization: Bearer $oidc_token"           -H "Content-Type: application/json"           --data "$(node -e 'console.log(JSON.stringify({action:"delete",user_id:process.env.E2E_USER_ID}))')"
