name: Playwright Tests
# Full validation gate for the release branch; never deploys or merges.
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

concurrency:
  group: marcenapp-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm

    - name: Reconcile canonical lockfile once
      run: |
        npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        if git diff --quiet -- package-lock.json; then
          echo "package-lock.json already canonical"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add package-lock.json
        git commit -m "chore: reconcile package lockfile"
        git push origin HEAD:fix/pre-release-full-sweep-20260913

    - name: Install dependencies
      id: install
      run: npm ci --ignore-scripts --no-audit

    - name: Dependency audit
      if: ${{ always() && steps.install.outcome == 'success' }}
      continue-on-error: true
      run: |
        npm audit --json > npm-audit.json || true
        node - <<'NODE'
        const fs = require('fs');
        const audit = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
        const meta = audit.metadata?.vulnerabilities ?? {};
        console.log('AUDIT SUMMARY', JSON.stringify(meta));
        for (const [name, info] of Object.entries(audit.vulnerabilities ?? {})) {
          console.log(JSON.stringify({ package: name, severity: info.severity, isDirect: info.isDirect, via: info.via?.map(v => typeof v === 'string' ? v : v.name), range: info.range, fixAvailable: info.fixAvailable }));
        }
        NODE

    - name: Lint
      id: lint
      continue-on-error: true
      run: |
        set +e
        npm run lint 2>&1 | tee lint.log
        status=${PIPESTATUS[0]}
        echo "lint_exit_code=$status" >> "$GITHUB_STEP_SUMMARY"
        exit "$status"

    - name: Typecheck diagnostics
      id: typecheck
      continue-on-error: true
      if: ${{ always() && steps.install.outcome == 'success' }}
      run: |
        set +e
        npx tsc -p tsconfig.app.json --noEmit 2>&1 | tee typecheck.log
        status=${PIPESTATUS[0]}
        echo "typecheck_exit_code=$status" >> "$GITHUB_STEP_SUMMARY"
        exit "$status"

    - name: Unit tests
      id: unit
      continue-on-error: true
      if: ${{ always() && steps.install.outcome == 'success' }}
      run: npm run test

    - name: Production build
      id: build
      continue-on-error: true
      if: ${{ always() && steps.install.outcome == 'success' }}
      run: npm run build

    - name: Install Playwright Browsers
      if: ${{ always() && steps.install.outcome == 'success' }}
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      id: playwright
      continue-on-error: true
      if: ${{ always() && steps.install.outcome == 'success' }}
      env:
        E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
        E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      run: npx playwright test

    - name: Upload diagnostics
      uses: actions/upload-artifact@v4
      continue-on-error: true
      if: always() && steps.install.outcome == 'success'
      with:
        name: diagnostics-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          npm-audit.json
          lint.log
          typecheck.log
          playwright-report/
          test-results/
        if-no-files-found: ignore
        retention-days: 7

    - name: Enforce validation gates
      if: ${{ always() && steps.install.outcome == 'success' }}
      run: |
        failed=0
        for gate in lint typecheck unit build playwright; do
          if [ "${{ steps.lint.conclusion }}" != "success" ] && [ "$gate" = "lint" ]; then failed=1; fi
          if [ "${{ steps.typecheck.conclusion }}" != "success" ] && [ "$gate" = "typecheck" ]; then failed=1; fi
          if [ "${{ steps.unit.conclusion }}" != "success" ] && [ "$gate" = "unit" ]; then failed=1; fi
          if [ "${{ steps.build.conclusion }}" != "success" ] && [ "$gate" = "build" ]; then failed=1; fi
          if [ "${{ steps.playwright.conclusion }}" != "success" ] && [ "$gate" = "playwright" ]; then failed=1; fi
        done
        echo "lint=${{ steps.lint.conclusion }}"
        echo "typecheck=${{ steps.typecheck.conclusion }}"
        echo "unit=${{ steps.unit.conclusion }}"
        echo "build=${{ steps.build.conclusion }}"
        echo "playwright=${{ steps.playwright.conclusion }}"
        exit "$failed"
