name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
concurrency:
  group: marcenapp-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      id: install
      run: npm ci
    - name: Dependency audit
      if: ${{ always() && steps.install.outcome == 'success' }}
      continue-on-error: true
      run: |
        npm audit --json > npm-audit.json || true
        node - <<'NODE'
        const fs = require('fs');
        const audit = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
        const meta = audit.metadata?.vulnerabilities ?? {};
        console.log('AUDIT SUMMARY', JSON.stringify(meta));
        for (const [name, info] of Object.entries(audit.vulnerabilities ?? {})) {
          console.log(JSON.stringify({ package: name, severity: info.severity, isDirect: info.isDirect, via: info.via?.map(v => typeof v === 'string' ? v : v.name), range: info.range, fixAvailable: info.fixAvailable }));
        }
        NODE
    - name: Lint
      id: lint
      continue-on-error: true
      run: |
        set +e
        npm run lint 2>&1 | tee lint.log
        status=${PIPESTATUS[0]}
        echo "lint_exit_code=$status" >> "$GITHUB_STEP_SUMMARY"
        exit "$status"
    - name: Typecheck diagnostics
      id: typecheck
      continue-on-error: true
      if: ${{ always() && steps.install.outcome == 'success' }}
      run: |
        set +e
        npx tsc -p tsconfig.app.json --noEmit 2>&1 | tee typecheck.log
        status=${PIPESTATUS[0]}
        echo "typecheck_exit_code=$status" >> "$GITHUB_STEP_SUMMARY"
        exit "$status"
    - name: Unit tests
      if: ${{ always() && steps.install.outcome == 'success' }}
      run: npm run test
    - name: Production build
      if: ${{ always() && steps.install.outcome == 'success' }}
      run: npm run build
    - name: Install Playwright Browsers
      if: ${{ always() && steps.install.outcome == 'success' }}
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      if: ${{ always() && steps.install.outcome == 'success' }}
      run: npm run test:e2e
    - name: Upload diagnostics
      uses: actions/upload-artifact@v4
      if: always() && steps.install.outcome == 'success'
      with:
        name: diagnostics-${{ github.sha }}-${{ github.run_id }}
        path: |
          npm-audit.json
          lint.log
          typecheck.log
          playwright-report/
          test-results/
        if-no-files-found: ignore
        retention-days: 7
    - name: Enforce validation gates
      if: ${{ always() && steps.install.outcome == 'success' }}
      run: |
        failed=0
        if [ "${{ steps.lint.conclusion }}" != "success" ]; then
          echo "Lint failed; see uploaded lint.log."
          failed=1
        fi
        if [ "${{ steps.typecheck.conclusion }}" != "success" ]; then
          echo "Typecheck failed; see uploaded typecheck.log."
          failed=1
        fi
        exit "$failed"
