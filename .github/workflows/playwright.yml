name: Playwright Tests
# Full validation gate for the release branch; never deploys or merges.
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: marcenapp-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm

    - name: Install dependencies
      id: install
      run: npm ci

    - name: Dependency audit (high/critical block)
      id: audit
      if: ${{ steps.install.outcome == 'success' }}
      run: |
        set +e
        npm audit --audit-level=high --json > npm-audit.json
        audit_exit=$?
        node - <<'NODE'
        const fs = require('fs');
        const audit = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
        const meta = audit.metadata?.vulnerabilities ?? {};
        console.log('AUDIT SUMMARY', JSON.stringify(meta));
        for (const [name, info] of Object.entries(audit.vulnerabilities ?? {})) {
          if (['high', 'critical'].includes(info.severity)) {
            console.log(JSON.stringify({ package: name, severity: info.severity, isDirect: info.isDirect, via: info.via?.map(v => typeof v === 'string' ? v : v.name), range: info.range, fixAvailable: info.fixAvailable }));
          }
        }
        NODE
        if [ "$audit_exit" -ne 0 ]; then
          echo "High/critical dependency vulnerabilities detected."
          exit "$audit_exit"
        fi

    - name: Lint
      id: lint
      if: ${{ steps.install.outcome == 'success' }}
      run: npm run lint

    - name: Typecheck
      id: typecheck
      if: ${{ steps.install.outcome == 'success' }}
      run: npx tsc -p tsconfig.app.json --noEmit

    - name: Unit tests
      id: unit
      if: ${{ steps.install.outcome == 'success' }}
      run: npm run test

    - name: Production build
      id: build
      if: ${{ steps.install.outcome == 'success' }}
      run: npm run build

    - name: Install Playwright Browsers
      if: ${{ steps.install.outcome == 'success' }}
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      id: playwright
      if: ${{ steps.install.outcome == 'success' }}
      env:
        E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
        E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      run: npx playwright test
