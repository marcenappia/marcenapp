name: Supabase Functions Deploy

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/asaas/**"
      - "supabase/functions/asaas-webhook/**"
      - "supabase/functions/ai-orchestrator/**"
      - "supabase/functions/ai-text/**"
      - "supabase/functions/ai-image/**"
      - "supabase/functions/e2e-bootstrap/**"
      - "supabase/functions/_shared/**"
      - "supabase/config.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production-smoke
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: uzhqhieqlcyncelltfjw
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Supabase credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_ID"

      - name: Deploy Asaas functions
        run: |
          supabase functions deploy asaas --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy asaas-webhook --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy IARA AI functions
        run: |
          supabase functions deploy ai-orchestrator --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy ai-text --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy ai-image --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy E2E bootstrap
        run: supabase functions deploy e2e-bootstrap --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
