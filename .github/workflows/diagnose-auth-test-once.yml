name: Diagnose auth test

on:
  push:
    branches:
      - fix/pre-release-full-sweep-20260913

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture auth test output
        run: |
          set +e
          npx vitest run src/test/Auth.test.tsx --reporter=verbose > auth-test-output.txt 2>&1
          status=$?
          echo "AUTH_TEST_STATUS=$status" >> auth-test-output.txt
          exit 0
      - name: Commit diagnostic output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auth-test-output.txt
          git commit -m "chore: capture auth test output" || exit 0
          git push
