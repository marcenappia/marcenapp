name: Cleanup auth diagnostics

on:
  push:
    branches:
      - fix/pre-release-full-sweep-20260913

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git rm -f auth-test-output.txt .github/workflows/diagnose-auth-test-once.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove auth test diagnostics"
          git push
