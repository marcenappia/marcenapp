name: Billing P0 Validation

on:
  workflow_dispatch:
  push:
    branches:
      - p0-billing-on-9632-20260912

concurrency:
  group: billing-p0-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  billing-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Billing P0
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: E2E tests
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npm run test:e2e
