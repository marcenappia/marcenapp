name: Supabase Migration Reconcile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'request production migration history reconciliation')
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: uzhqhieqlcyncelltfjw
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Supabase credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_ID"

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Fetch exact production migration history
        run: |
          rm -f supabase/migrations/*.sql
          supabase migration fetch --linked
          test -n "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print -quit)"

      - name: Verify local and remote migration versions
        run: |
          supabase migration list --linked
          supabase migration list --local
          supabase db push --dry-run --linked

      - name: Remove reconciliation marker
        run: rm -f supabase/.reconcile-production-migrations

      - name: Commit exact production migration history
        run: |
          git config user.name "marcenapp-migration-bot"
          git config user.email "marcenapp-migration-bot@users.noreply.github.com"
          git add supabase/migrations supabase/.reconcile-production-migrations
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "chore(db): synchronize migration history from production"
          git push origin HEAD:main
