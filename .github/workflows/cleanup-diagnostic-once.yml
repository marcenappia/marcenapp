name: Cleanup diagnostics

on:
  push:
    branches:
      - fix/pre-release-full-sweep-20260913

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove diagnostic file
        run: |
          git rm -f unit-test-output.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary unit test output"
          git push
