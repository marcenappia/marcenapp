name: P1 Validation
on:
  push:
    branches:
      - fix/p1-product-data-hardening-20260913
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: npm ci
        id: install
        run: npm ci
      - name: lint
        if: ${{ always() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: npm run lint
      - name: typecheck
        if: ${{ always() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: npm run typecheck
      - name: test
        if: ${{ always() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: npm test
      - name: build
        if: ${{ always() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: npm run build
