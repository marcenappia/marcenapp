name: Temporary Lockfile Reconcile
on:
  push:
    branches: [fix/pre-release-full-sweep-20260913]
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Generate canonical lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-package-lock-${{ github.sha }}
          path: package-lock.json
          retention-days: 1
