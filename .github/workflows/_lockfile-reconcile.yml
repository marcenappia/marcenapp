name: Temporary Lockfile Reconcile
on:
  push:
    branches: [fix/pre-release-full-sweep-20260913]
permissions:
  contents: write
jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, 'chore(ci): reconcile canonical lockfile') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Generate and commit canonical lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already canonical'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(ci): reconcile canonical lockfile'
          git push origin HEAD:${GITHUB_REF_NAME}
