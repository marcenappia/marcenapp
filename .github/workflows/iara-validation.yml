name: IARA Validation
on:
  push:
    branches: [ validation/iara-e3d0-20260913 ]
  workflow_dispatch:
concurrency:
  group: iara-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact validation tree
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: npm ci
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Install Playwright
        run: npx playwright install --with-deps
      - name: Playwright E2E
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test
