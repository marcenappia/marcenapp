name: Diagnose unit tests

on:
  push:
    branches:
      - fix/pre-release-full-sweep-20260913

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture unit test output
        run: |
          set +e
          npm test > /tmp/unit-test-output.txt 2>&1
          status=$?
          cp /tmp/unit-test-output.txt unit-test-output.txt
          echo "UNIT_TEST_STATUS=$status" >> unit-test-output.txt
          exit 0
      - name: Commit diagnostic output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unit-test-output.txt
          git commit -m "chore: capture unit test failure output" || exit 0
          git push
